name: Validate Windows section views

on:
  push:
    branches: [validation/windows-section-views]

permissions:
  contents: read
  statuses: write

jobs:
  native-windows:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - 3cf59cde8046b361f2afcdf03a273a6ab76a1b3e
          - 174b83440deb6b102f33f49866b7abd40e02070c
    env:
      REVISION: ${{ matrix.revision }}
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.REVISION }}
      - name: Verify revision
        run: test "$(git rev-parse HEAD)" = "$REVISION"
      - name: Install Rust
        run: rustup toolchain install nightly-2026-07-06 --profile minimal
      - name: Verify regression tests exist
        run: |
          cargo +nightly-2026-07-06 test -p vm-memory --no-default-features --features backend-mmap,backend-bitmap -- --list > tests.txt
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          listing = Path("tests.txt").read_text()
          for name in (
              "map_file_offset",
              "map_invalid_extents",
              "map_failed_view",
          ):
              assert "mmap::windows::tests::" + name + ": test" in listing, listing
          if os.environ["REVISION"] == "174b83440deb6b102f33f49866b7abd40e02070c":
              for name in ("map_section_views", "map_section_release"):
                  assert "mmap::windows::tests::" + name + ": test" in listing, listing
          PYTHON
      - name: Run native tests
        run: cargo +nightly-2026-07-06 test -p vm-memory --no-default-features --features backend-mmap,backend-bitmap -- --show-output
      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request

          env = os.environ
          state = "success" if env["RESULT"] == "success" else "failure"
          payload = json.dumps({
              "state": state,
              "context": "Native Windows memory",
              "description": "Exact revision native Windows memory validation",
              "target_url": f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/statuses/{env['REVISION']}",
              data=payload,
              headers={"Authorization": "Bearer " + env["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201, response.status
          PYTHON
